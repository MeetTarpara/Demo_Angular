<div class="container d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card shadow-lg border-0 rounded-4 p-4" style="width: 380px;">
  
      <div class="text-center mb-4">
        <h3 class="fw-bold">Create Account</h3>
        <p class="text-muted small">Register to get started</p>
      </div>
  
      <!-- Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-person"></i>
          </span>
          <input type="text"
                 class="form-control"
                 placeholder="Enter your name"
                 [(ngModel)]="name">
        </div>
      </div>
  
      <!-- Email -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email"
                 class="form-control"
                 placeholder="Enter your email"
                 [(ngModel)]="email">
        </div>
      </div>
  
      <!-- Password -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password"
                 class="form-control"
                 placeholder="Enter your password"
                 [(ngModel)]="password">
        </div>
      </div>
  
      <!-- Button -->
      <button class="btn btn-success w-100 py-2 fw-semibold" (click)="onRegister()">
        Register
      </button>
  
      <!-- Message -->
      <div class="text-success mt-3 text-center small">
        {{message}}
      </div>
  
      <!-- Login Link -->
      <div class="text-center mt-3">
        <small class="text-muted">
          Already have an account?
          <a href="login2" class="text-decoration-none fw-semibold">Login</a>
        </small>
      </div>
  
    </div>
  </div>

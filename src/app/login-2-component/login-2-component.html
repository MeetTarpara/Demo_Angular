<div class="container d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card shadow-lg border-0 rounded-4 p-4" style="width: 380px;">
      
      <div class="text-center mb-4">
        <h3 class="fw-bold">Welcome Back</h3>
        <p class="text-muted small">Login to your account</p>
      </div>
  
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email"
                 class="form-control"
                 placeholder="Enter your email"
                 [(ngModel)]="email">
        </div>
      </div>
  
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password"
                 class="form-control"
                 placeholder="Enter your password"
                 [(ngModel)]="password">
        </div>
      </div>
  
      <button class="btn btn-primary w-100 py-2 fw-semibold" (click)="onLogin()">
        Login
      </button>
  
      <div class="text-danger mt-3 text-center small">
        {{errorMsg}}
      </div>
  
      <div class="text-center mt-3">
        <small class="text-muted">
          Don't have an account?
          <a href="/register" class="text-decoration-none fw-semibold">Register</a>
        </small>
      </div>
  
    </div>
  </div>
